<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>官能評価 回答</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#222;--sub:#666;--line:#ddd6ca;--accent:#2f5d8a;--accent-bg:#e8eff6;--warn:#8a4b12;--warn-bg:#fbf0e3;--ok:#2e6b3a;--ok-bg:#e6f2e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3d43;--accent:#8fb6dd;--accent-bg:#26323f;--warn:#e0b07a;--warn-bg:#3a2e22;--ok:#9fd3a8;--ok-bg:#223328}}
:root[data-theme="dark"]{--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3d43;--accent:#8fb6dd;--accent-bg:#26323f;--warn:#e0b07a;--warn-bg:#3a2e22;--ok:#9fd3a8;--ok-bg:#223328}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;font-size:19px;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:16px 16px 200px}
h1{font-size:1.15rem;margin:.2em 0;color:var(--sub);font-weight:600}
.who{font-size:1.5rem;font-weight:700;margin:.2em 0}
.who b{font-size:2.2rem}
.route{font-size:1.3rem;font-weight:700;background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:6px 12px;display:inline-block}
.q{margin:.6em 0}
.set{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;margin:12px 0}
.set h2{font-size:1.25rem;margin:0 0 8px}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.codes button{font-size:1.7rem;font-weight:700;min-height:68px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.codes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.cup{border-top:1px solid var(--line);padding:8px 0 4px}
.cup:first-of-type{border-top:0;padding-top:0}
.ch{margin:0 0 6px;font-size:1.05rem}
.ch b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.it{margin:6px 0 2px;font-weight:700}
.ends{display:flex;justify-content:space-between;margin:0;font-size:.9rem;color:var(--sub)}
.key{font-size:.95rem;display:flex;flex-wrap:wrap;gap:2px 12px;margin:.4em 0}
.opts,.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vals{gap:8px}
.ends2{display:grid;gap:8px;margin:2px 0 0;font-size:.9rem;color:var(--sub)}
.ends2 span{text-align:right}
.none{margin-top:10px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.opts button,.vals button,.words button,.none button{font-size:1.15rem;min-height:48px;min-width:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;padding:4px 10px}
.opts button[aria-pressed="true"],.vals button[aria-pressed="true"],.words button[aria-pressed="true"],.none button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:520px;margin:0 auto}
#send{width:100%;font-size:1.3rem;font-weight:700;min-height:56px;border-radius:12px;border:0;background:var(--accent);color:var(--card);cursor:pointer}
#send:disabled{opacity:.45;cursor:default}
#status{font-size:1rem;margin:0 0 8px;border-radius:8px;padding:6px 10px}
#status.ok{background:var(--ok-bg);color:var(--ok)}
#status.ng{background:var(--warn-bg);color:var(--warn);font-weight:700}
#status:empty{display:none}
.msg{font-size:1.15rem;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px}
.pidrow{margin:.4em 0}
.pidrow input{font-size:1.5rem;width:5.5em;letter-spacing:.15em;text-transform:uppercase;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.net{background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:8px;padding:6px 10px;margin:0 0 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p id="net" class="net" hidden>電波がありません。答えは選べますが、送れません。</p>
<p id="msg" class="msg">準備しています…</p>
<div id="work" hidden>
  <p class="who">評価者番号 <b id="ev"></b></p>
  <p id="pidrow" class="pidrow" hidden><label>名札の番号 <input type="text" id="pid" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false"></label></p>
  <p id="route" class="route" hidden></p>
  <p class="q" id="ask"></p>
  <p class="q" id="rinse" hidden>上のセットから順に味わいます。セットのあいだは、口をすすいでください。</p>
  <div id="sets"></div>
</div>
</main>
<div class="bar" id="bar" hidden><div class="in"><p id="status" role="status" aria-live="polite"></p><button type="button" id="send" disabled>送る</button></div></div>

// me.q＝問い（店の q。無ければ3点試験法）・sel＝{セット: 答え}（手法ごとの形は下）・sent＝送った答えの文字列
var g = String(new URLSearchParams(location.search).get('g') || '').toUpperCase(), me = {e: null, visits: [], sel: {}, sent: null, q: {m: 'triangle'}, p: ''};
var PKEY = 'phone_panel_p'; // 自分の番号（分析型の組で聞く・§12）。一度打つとこのスマホが覚え、次からは入った状態で出す
window.PHONE_PANEL = me; // 点検用
var PICK = {triangle: 1, paired_diff: 1, paired_pref: 1, duotrio: 1};
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function msg(t){ $('msg').hidden = !t; $('msg').textContent = t || ''; }
function status(t, cls){ $('status').textContent = t || ''; $('status').className = cls || ''; }
function key(){ return 'phone_panel_' + g + '_' + me.e; }
function save(){ try { localStorage.setItem(key(), JSON.stringify({sel: me.sel, sent: me.sent})); } catch (e) {} }
function load(){ try { return JSON.parse(localStorage.getItem(key()) || 'null'); } catch (e) { return null; } }
function m(){ return me.q.m; }
function needP(){ return me.q.id === 1; }
function items(){ return (me.q.it || []).length || 1; }
function nW(){ return (me.q.w || []).length; }
// 問い：紙の回答用紙の問い（selector.html の question()）と同じ中身・同じ言葉。「○をつけて」「書いて」は「押して」に
function ask(){
  var q = me.q, at = q.at ? '「' + q.at + '」' : '（　　　　　）';
  switch (m()){
    case 'paired_diff': return '2つを左から順に味わい、' + at + 'が強い方のコードを押してください。分からないときも、どちらか1つを押してください（勘でかまいません）。';
    case 'paired_pref': return '2つを左から順に味わい、好きな方のコードを押してください。分からないときも、どちらか1つを押してください（勘でかまいません）。';
    case 'duotrio': return 'はじめに「見本」を味わって覚えてください。次に2つを左から順に味わい、見本と同じもののコードを押してください。分からないときも、どちらか1つを押してください（勘でかまいません）。';
    case 'ranking': return '左から順に味わい、' + (q.p === 'intensity' ? at + 'がいちばん強いもの' : 'いちばん好きなもの') + 'を 1 として、順位を押してください。分からないときも、順位を押してください（勘でかまいません）。'; // 同じ順位を押すと前の方が外れるので、「同じ順位は1つだけ」は言わない（紙の問いはそのまま）
    case 'scoring': { var w = q.p === 'pref' ? '好ましさ' : '強さ', one = q.it && q.it[0] ? '「' + q.it[0] + '」の' : q.p === 'pref' ? '' : '（　　　　　）の';
      return items() > 1 ? '左から順に味わい、試料ごとに、各行の' + w + 'に当てはまる数字を1つずつ押してください。' : '左から順に味わい、' + one + w + 'に当てはまる数字を1つ押してください。'; }
    case 'cata': return '左から順に味わい、試料ごとに、当てはまる言葉すべてを押してください。当てはまる言葉が無い試料は「当てはまるものなし」を押してください。';
  }
  return '3つのうち2つは同じで、1つだけ違います。左から順に味わい、違う1つのコードを押してください。分からないときも、どれか1つを押してください（勘でかまいません）。';
}
// 問いを読む：形が違えば null（読めない）
function readQ(s){
  if (s === null || s === undefined) return {m: 'triangle'}; // q の無い組（host.html の組）は3点試験法
  var q; try { q = JSON.parse(s); } catch (e) { return null; }
  if (!q || typeof q !== 'object' || !/^(triangle|paired_diff|paired_pref|duotrio|ranking|scoring|cata)$/.test(q.m)) return null;
  var strs = function(x){ return Array.isArray(x) && x.every(function(y){ return typeof y === 'string'; }); };
  if (q.at !== undefined && typeof q.at !== 'string') return null;
  if (q.id !== undefined && q.id !== 1) return null;
  if (q.m === 'scoring' && !(Array.isArray(q.v) && q.v.length >= 2 && q.v.every(function(x){ return x === (x | 0) && x >= -3 && x <= 10; }) && strs(q.it || []) && (!q.sw || (strs(q.sw) && q.sw.length === q.v.length)))) return null;
  if (q.m === 'cata' && !(strs(q.w) && q.w.length >= 1 && q.w.length <= 25)) return null;
  return q;
}
function full(v){ // そのセットに全部答えたか
  var s = me.sel[v.set];
  if (PICK[m()]) return v.codes.indexOf(s) >= 0;
  if (!s) return false;
  if (m() === 'ranking'){ var seen = {}; return v.codes.every(function(c){ var r = s[c]; if (!(r >= 1 && r <= v.codes.length) || seen[r]) return false; seen[r] = 1; return true; }); }
  if (m() === 'scoring') return v.codes.every(function(c){ for (var t = 0; t < items(); t++) if (me.q.v.indexOf(s[c + '_' + t]) < 0) return false; return true; });
  return v.codes.every(function(c){ return Array.isArray(s[c]); }); // CATA：空の配列＝当てはまるものなし
}
function part(v){ // 1セット分の答えの文字（store.js の ANS_RE の形）
  var s = me.sel[v.set];
  if (PICK[m()]) return v.set + ':' + s;
  if (m() === 'ranking') return v.set + ':' + v.codes.slice().sort(function(x, y){ return s[x] - s[y]; }).join(',');
  if (m() === 'scoring') return v.set + ':' + v.codes.map(function(c){ var o = []; for (var t = 0; t < items(); t++) o.push(s[c + '_' + t]); return c + '=' + o.join('.'); }).join(',');
  return v.set + ':' + v.codes.map(function(c){ return c + '=' + s[c].slice().sort(function(x, y){ return x - y; }).map(function(w){ return w + 1; }).join('.'); }).join(',');
}
function answerStr(){ return me.visits.map(part).join('|'); }
function sentKey(){ return answerStr() + (needP() ? '#' + me.p : ''); } // 番号を直したら、もう一度送る
function left(){ return me.visits.filter(function(v){ return !full(v); }).length; }
function btn(attrs, pressed, text, label){ return '<button type="button" ' + attrs + ' aria-pressed="' + String(!!pressed) + '"' + (label ? ' aria-label="' + esc(label) + '"' : '') + '>' + text + '</button>'; }
function setBody(v){
  var s = me.sel[v.set], h = '', D = 'data-set="' + v.set + '" ';
  if (PICK[m()]) return '<div class="codes" style="grid-template-columns:repeat(' + v.codes.length + ',1fr)">'
    + v.codes.map(function(c){ return btn(D + 'data-code="' + c + '"', s === c, c); }).join('') + '</div>';
  v.codes.forEach(function(c, i){
    var x = s && s[c]; h += '<div class="cup"><p class="ch"><b>' + c + '</b></p>'; // 上から順は問いの文で言っている
    if (m() === 'ranking'){ h += '<div class="opts">'; for (var r = 1; r <= v.codes.length; r++) h += btn(D + 'data-code="' + c + '" data-r="' + r + '"', x === r, r + '位', c + 'に' + r + '位'); h += '</div>'; }
    else if (m() === 'scoring'){ // 1行に収まらない数は2行に（ボタンを44px以上に保つ。11段階は 0〜5／6〜10、7段階は −3〜0／+1〜+3）。2行のときは「弱い」を1行目の左上、「強い」を2行目の右下に
      var vals = me.q.v, cols = vals.length === 9 ? 5 : vals.length > 7 ? 6 : vals.length === 7 ? 4 : vals.length, neg = vals[0] < 0, lo = me.q.p === 'pref' ? '嫌い' : '弱い', hi = me.q.p === 'pref' ? '好き' : '強い';
      for (var t = 0; t < items(); t++){
        var it = (me.q.it || [])[t];
        if (items() > 1) h += '<p class="it">' + (it ? esc(it) : '（　　　）') + '</p>';
        var two = cols < vals.length;
        if (!me.q.sw) h += '<p class="ends"><span>' + lo + '</span>' + (two ? '' : '<span>' + hi + '</span>') + '</p>'; // 言葉は両端だけ（紙と同じ）
        h += '<div class="vals" style="grid-template-columns:repeat(' + cols + ',1fr)">' + vals.map(function(val){ var sv = val > 0 && neg ? '+' + val : String(val); return btn(D + 'data-code="' + c + '" data-t="' + t + '" data-s="' + val + '"', s && s[c + '_' + t] === val, sv, c + (it ? 'の' + it : '') + 'に' + sv); }).join('') + '</div>';
        if (!me.q.sw && two) h += '<p class="ends2" style="grid-template-columns:repeat(' + cols + ',1fr)"><span style="grid-column:' + ((vals.length - 1) % cols + 1) + '">' + hi + '</span></p>';
      }
    } else {
      h += '<div class="words">' + me.q.w.map(function(w, wi){ return btn(D + 'data-code="' + c + '" data-w="' + wi + '"', x && x.indexOf(wi) >= 0, esc(w)); }).join('') + '</div>'
        + '<div class="none">' + btn(D + 'data-code="' + c + '" data-none="1"', x && x.length === 0, '当てはまるものなし') + '</div>'; // 言葉の列から離す
    }
    h += '</div>';
  });
  return h;
}
function render(){
  var h = '', sw = me.q.sw;
  if (m() === 'scoring' && sw) h += '<p class="key">' + sw.map(function(w, i){ return '<span>' + me.q.v[i] + '＝' + esc(w) + '</span>'; }).join('') + '</p>'; // 9段階の言葉は上に1か所（紙と同じ）
  me.visits.forEach(function(v){ h += '<section class="set">' + (me.visits.length > 1 ? '<h2>セット' + v.set + '</h2>' : '') + setBody(v) + '</section>'; });
  $('sets').innerHTML = h; bar();
}
function bar(){
  var n = left(), noP = needP() && !STORE.P_RE.test(me.p), now = n || noP ? null : sentKey();
  $('send').disabled = n > 0 || noP || me.sent === now; // 送ったあとは、答えを直すまで押せない（「送りました」を見せたまま）
  if (noP) status(/[01IO]/.test(me.p) ? '0・1・I・O は使いません。' : '名札の番号（4文字）を入れてください。', '');
  else if (n > 0) status(PICK[m()] ? 'あと' + n + 'セット選んでください。' : 'あと' + n + 'セット、答えていない所があります。', '');
  else if (me.sent === now) status('送りました。直すときは選び直して、もう一度送ってください。', 'ok');
  else if (me.sent) status('直した答えは、まだ送っていません。', 'ng');
  else status('全部選びました。「送る」を押してください。', '');
}
$('sets').addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-code]'); if (!b) return;
  var set = +b.getAttribute('data-set'), c = +b.getAttribute('data-code'), s = me.sel[set];
  if (PICK[m()]) me.sel[set] = c;
  else {
    s = s && typeof s === 'object' ? s : {};
    if (b.hasAttribute('data-r')){ var r = +b.getAttribute('data-r'); if (s[c] === r) delete s[c]; else { for (var k in s) if (s[k] === r) delete s[k]; s[c] = r; } } // 同じ順位は1つだけ（前の方を消す）
    else if (b.hasAttribute('data-s')){ var sk = c + '_' + b.getAttribute('data-t'), x = +b.getAttribute('data-s'); if (s[sk] === x) delete s[sk]; else s[sk] = x; }
    else if (b.hasAttribute('data-none')){ if (s[c] && s[c].length === 0) delete s[c]; else s[c] = []; }
    else { var w = +b.getAttribute('data-w'), l = (s[c] || []).slice(), at = l.indexOf(w); if (at >= 0) l.splice(at, 1); else l.push(w); if (l.length) s[c] = l; else delete s[c]; } // 言葉を全部消したら未回答に戻す
    me.sel[set] = s;
  }
  save(); render();
});
$('pid').addEventListener('input', function(){
  var v = this.value.replace(/[\uFF01-\uFF5E]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 4); if (v !== this.value) this.value = v; // 全角英数・小文字・空白をならす（打ち込むタブの TALLY.norm と同じ）
  me.p = v; if (STORE.P_RE.test(v)) try { localStorage.setItem(PKEY, v); } catch (e) {}
  bar();
});
$('send').addEventListener('click', function(){
  if (left() || (needP() && !STORE.P_RE.test(me.p))) return;
  var a = answerStr(), k = sentKey(), btn0 = this; btn0.disabled = true; status('送っています…', '');
  STORE.send(g, me.e, a, function(){ me.sent = k; save(); bar(); }, needP() ? me.p : undefined).then(function(){ me.sent = k; save(); bar(); }, function(err){
    btn0.disabled = false;
    status(err && err.offline ? '送れていません（電波がないようです）。つながる所で、もう一度「送る」を押してください。' : '送れていません。もう一度「送る」を押してください。', 'ng');
  });
});

if (!STORE.ROOM_RE.test(g)){ msg('この画面のアドレスが正しくありません。係の人のQRコードから開き直してください。'); return; }
STORE.init().then(function(){ return STORE.claim(g); }).then(function(e){
  if (e === null){ msg('この組は見つかりません。係の人に知らせてください。'); return; }
  if (!e){ msg('もう満員です。係の人に知らせてください。'); return; }
  me.e = e;
  return Promise.all([STORE.getSlot(g, e), STORE.getQ(g)]).then(function(r){
    var s = r[0], q = readQ(r[1]);
    if (typeof s !== 'string' || !STORE.SLOT_RE.test(s) || !q){ msg('読み込めませんでした。開き直してください。'); return; }
    me.q = q;
    var parts = s.split('|'), head = parts.shift(), start = +head.slice(0, -1), dir = head.slice(-1);
    me.visits = parts.map(function(p){ var x = p.split(':'); return {set: +x[0], codes: x[1].split(',').map(Number)}; });
    if (me.visits.some(function(v){ return PICK[m()] ? v.codes.length !== (m() === 'triangle' ? 3 : 2) : false; })){ msg('読み込めませんでした。開き直してください。'); return; }
    var old = load(); if (old){ me.sel = old.sel || {}; me.sent = old.sent || null; }
    $('ev').textContent = e; $('ask').textContent = ask();
    if (needP()){ try { var p0 = localStorage.getItem(PKEY) || ''; if (STORE.P_RE.test(p0)) me.p = p0; } catch (e1) {} $('pid').value = me.p; $('pidrow').hidden = false; }
    if (me.visits.length > 1){ $('route').hidden = false; $('route').textContent = '開始セット：' + start + '・' + (dir === 'L' ? '左へ' : '右へ'); $('rinse').hidden = false; } // 紙の回答用紙と同じ「開始セット：3・左へ」
    msg(''); $('work').hidden = false; $('bar').hidden = false; render();
  });
}).catch(function(){ msg('つながりません。電波を確かめて、開き直してください。'); });
STORE.init().then(function(){ STORE.onConn(function(on){ $('net').hidden = on; }); });
})();
</script>
</body>
