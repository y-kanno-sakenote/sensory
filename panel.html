<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>官能評価 回答</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#222;--sub:#666;--line:#ddd6ca;--accent:#2f5d8a;--accent-bg:#e8eff6;--warn:#8a4b12;--warn-bg:#fbf0e3;--ok:#2e6b3a;--ok-bg:#e6f2e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3d43;--accent:#8fb6dd;--accent-bg:#26323f;--warn:#e0b07a;--warn-bg:#3a2e22;--ok:#9fd3a8;--ok-bg:#223328}}
:root[data-theme="dark"]{--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3d43;--accent:#8fb6dd;--accent-bg:#26323f;--warn:#e0b07a;--warn-bg:#3a2e22;--ok:#9fd3a8;--ok-bg:#223328}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;font-size:19px;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:16px 16px 200px}
h1{font-size:1.15rem;margin:.2em 0;color:var(--sub);font-weight:600}
.who{font-size:1.5rem;font-weight:700;margin:.2em 0}
.who b{font-size:2.2rem}
.route{font-size:1.3rem;font-weight:700;background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:6px 12px;display:inline-block}
.q{margin:.6em 0}
.set{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;margin:12px 0}
.set h2{font-size:1.25rem;margin:0 0 8px}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.codes button{font-size:1.7rem;font-weight:700;min-height:68px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.codes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:520px;margin:0 auto}
#send{width:100%;font-size:1.3rem;font-weight:700;min-height:56px;border-radius:12px;border:0;background:var(--accent);color:var(--card);cursor:pointer}
#send:disabled{opacity:.45;cursor:default}
#status{font-size:1rem;margin:0 0 8px;border-radius:8px;padding:6px 10px}
#status.ok{background:var(--ok-bg);color:var(--ok)}
#status.ng{background:var(--warn-bg);color:var(--warn);font-weight:700}
#status:empty{display:none}
.msg{font-size:1.15rem;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px}
.net{background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:8px;padding:6px 10px;margin:0 0 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p id="net" class="net" hidden>電波がありません。答えは選べますが、送れません。</p>
<p id="msg" class="msg">準備しています…</p>
<div id="work" hidden>
  <p class="who">評価者番号 <b id="ev"></b></p>
  <p id="route" class="route" hidden></p>
  <p class="q">3つのうち2つは同じで、1つだけ違います。左から順に味わい、違う1つのコードを押してください。分からないときは、勘でどれか1つを。</p>
  <p class="q" id="rinse" hidden>上のセットから順に味わいます。セットのあいだは、口をすすいでください。</p>
  <div id="sets"></div>
</div>
</main>
<div class="bar" id="bar" hidden><div class="in"><p id="status" role="status" aria-live="polite"></p><button type="button" id="send" disabled>送る</button></div></div>

<!-- 中核（SHEET・TALLY）は入れない：この画面が受け取るのは自分のコードの並びだけで、中身を割り出す処理を持たない -->

<script id="store">

var FIREBASE_CONFIG = {apiKey: 'AIzaSyCOve6rL8oHlQsICBOzp4EMpcOWmvyxYj0', authDomain: 'sensory-phone.firebaseapp.com', databaseURL: 'https://sensory-phone-default-rtdb.asia-southeast1.firebasedatabase.app', projectId: 'sensory-phone', appId: '1:949669466785:web:b4c62959be942cad5a56e0'};
var STORE = (function(){

var FORCED = QS.get('local') === '1', LOCAL = FORCED || !FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL;
var CH = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // SHEET.GROUP_CHARS と同じ（0/O・1/I なし）
var ROOM_RE = /^[2-9A-HJ-NP-Z]{6}$/, KEY_RE = /^[2-9A-HJ-NP-Z]{10}$/;
// データの形（database.rules.json と同じ決まり。README の表）：
// groups/$g/{host: 作った uid, hostkey: 秘密（誰も読めない）, hosts/$uid: 秘密（係の端末）, n: 枠の数,
//            slots/$e: 並び, claims/$e: uid, byuid/$uid: 番号, answers/$e: {a, t}}
// slots/$e＝「開始セット＋向き|セット:コード,コード,コード|…」（回る順・置き換えた後のコード）。中身（どれが違う1つか）は入れない
var SLOT_RE = /^[0-9][0-9]?[RL](\|[0-9][0-9]?:[0-9][0-9][0-9],[0-9][0-9][0-9],[0-9][0-9][0-9])+$/;
// answers/$e/a＝「セット:選んだコード|…」
var ANS_RE = /^[0-9][0-9]?:[0-9][0-9][0-9](\|[0-9][0-9]?:[0-9][0-9][0-9])*$/;
var log = []; // この端末が受け取ったデータの控え（点検用。画面には出さない）
function rec(v){ try { log.push(JSON.parse(JSON.stringify(v === undefined ? null : v))); } catch (e) {} return v; }
function rand(len){ var b = new Uint8Array(len), s = ''; crypto.getRandomValues(b); for (var i = 0; i < len; i++) s += CH[b[i] % 32]; return s; } // 256÷32 で偏りなし
function loadScript(src){ return new Promise(function(ok, ng){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function(){ ng(new Error('load ' + src)); }; document.head.appendChild(s); }); }
function offlineErr(){ var e = new Error('offline'); e.offline = true; return e; }
function denied(){ return new Error('denied'); }

// ---------- 疑似通信（同じ端末の別タブ同士）。database.rules.json と同じ可否をここで真似る ----------
function Local(){
  var me = this, PRE = 'phone_db_', chans = {};
  // 端末の代わり＝タブ。window.name はタブ（iframe）ごとで、開き直しても残る＝「同じ端末で開き直したら同じ番号」を真似る
  var m = /^phoneuid:([A-Za-z0-9]+)/.exec(window.name || '');
  this.uid = m ? m[1] : (function(){ var u = 'L' + rand(12); window.name = 'phoneuid:' + u; return u; })();
  this.mode = 'local';
  function read(g){ try { var v = localStorage.getItem(PRE + g); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function chan(g){ if (!chans[g] && typeof BroadcastChannel !== 'undefined') chans[g] = new BroadcastChannel(PRE + g); return chans[g]; }
  function locked(g, fn){ // 読んで書くまでを1つの鍵で（ほかのタブと取り合わない＝トランザクションの代わり）
    var run = function(){ return Promise.resolve().then(function(){ var d = read(g), r = fn(d); if (r && r.remove){ localStorage.removeItem(PRE + g); var c0 = chan(g); if (c0) c0.postMessage(1); fire(g); } if (r && r.write){ localStorage.setItem(PRE + g, JSON.stringify(r.write)); var c = chan(g); if (c) c.postMessage(1); fire(g); } return r ? r.value : undefined; }); };
    return navigator.locks && navigator.locks.request ? navigator.locks.request(PRE + g, run) : run();

  function fire(g){ (watchers[g] || []).forEach(function(cb){ cb(view(read(g))); }); }
  this.init = function(){ return Promise.resolve(me); };
  this.create = function(g, key, n, slots){ return locked(g, function(d){ if (d && d.host) throw new Error('exists'); var h = {}; h[me.uid] = key; return {write: {host: me.uid, hostkey: key, hosts: h, n: n, slots: slots}}; }); };

  this.watch = function(g, cb){ (watchers[g] = watchers[g] || []).push(cb); var c = chan(g); if (c) c.addEventListener('message', function(){ cb(view(read(g))); });

    for (var e = 1; e <= d.n; e++) if (!cl[e]){ cl[e] = me.uid; by[me.uid] = String(e); d.claims = cl; d.byuid = by; return {write: d, value: e}; }
    return {value: 0}; // 空きなし
  }); };
  this.remove = function(g){ return locked(g, function(d){ if (!isHost(d)) throw denied(); return {remove: true, value: true}; }); }; // 組をまるごと消す：係だけ（ルールと同じ）
  this.getSlot = function(g, e){ var d = read(g); if (!d || !d.slots) return Promise.resolve(null);
    if (!((d.claims || {})[e] === me.uid || isHost(d))) return Promise.reject(denied()); // 自分の番号の並びだけ（係は全部）
    return Promise.resolve(d.slots[e] || null); };
  this.send = function(g, e, a){
    if (navigator.onLine === false) return Promise.reject(offlineErr());
    return locked(g, function(d){ if (!d || !d.claims || d.claims[e] !== me.uid) throw denied(); d.answers = d.answers || {}; d.answers[e] = {a: a, t: Date.now()}; return {write: d, value: true}; });
  };

// ---------- Firebase Realtime Database（compat SDK 10.14.1・匿名認証） ----------
function Fire(){
  var me = this, db = null, connected = true;

      return new Promise(function(res){ var off = auth.onAuthStateChanged(function(u){ off(); res(u); }); }).then(function(u){ return u || auth.signInAnonymously().then(function(c){ return c.user; }); })
        .then(function(u){ me.uid = u.uid; db = app.database(); db.ref('.info/connected').on('value', function(s){ connected = s.val() === true; }); return me; });
    });
  };
  function G(g){ return db.ref('groups/' + g); }
  // 作る：host を取ってから、hostkey・自分の hosts・枠の数・並びを1回の更新で（ルールは同じ更新の中の hostkey と比べる）
  this.create = function(g, key, n, slots){
    return G(g).child('host').transaction(function(cur){ return cur ? undefined : me.uid; }).then(function(r){
      if (!r.committed || r.snapshot.val() !== me.uid) throw new Error('exists');
      var u = {hostkey: key, n: n, slots: slots}; u['hosts/' + me.uid] = key;
      return G(g).update(u);

  this.register = function(g, key){ return G(g).child('host').get().then(function(s){ if (!s.exists()) return null; return G(g).child('hosts/' + me.uid).set(key).then(function(){ return true; }, function(){ throw denied(); }); }); };
  this.watch = function(g, cb){ var cur = {claims: null, answers: null}, err = function(e){ console.error('組を読めません（ルール未設定の可能性）', e); };
    G(g).child('claims').on('value', function(s){ cur.claims = s.val(); cb(cur); }, err);
    G(g).child('answers').on('value', function(s){ cur.answers = s.val(); cb(cur); }, err); };

  // 先を越されたら次の番号へ。断られても、その番号が自分の uid になっていれば（前の書き込みが通っていた）そのまま返す
  this.claim = function(g){
    return Promise.all([G(g).child('host').get(), G(g).child('n').get(), G(g).child('claims').get(), G(g).child('byuid/' + me.uid).get()]).then(function(v){

          return Promise.all([G(g).child('byuid/' + me.uid).get(), G(g).child('claims/' + e).get()]).then(function(v2){
            var b = v2[0].val(); if (b) return +b;
            cl[e] = v2[1].val() || 'x'; return next();
          }, next);
        });
      }
      return next();
    });
  };
  // 組をまるごと消す：ルールが係（hosts/<自分>）だけに通す。先に見張りを外す（消したあとは answers を読めなくなる）
  this.remove = function(g){ G(g).child('claims').off(); G(g).child('answers').off(); return G(g).remove().then(function(){ return true; }, function(){ throw denied(); }); };
  this.getSlot = function(g, e){ return G(g).child('slots/' + e).get().then(function(s){ return s.val(); }); };
  // 送る：つながっていないと SDK は書き込みを溜めて後で送るので、6秒で届かなければ「送れていない」と返し、届いたら onLate を呼ぶ
  this.send = function(g, e, a, onLate){
    var done = false, p = G(g).child('answers/' + e).set({a: a, t: firebase.database.ServerValue.TIMESTAMP}).then(function(){ done = true; return true; });
    var t = new Promise(function(_, ng){ setTimeout(function(){ if (!done) ng(offlineErr()); }, connected ? 6000 : 300); });
    p.then(function(){ if (onLate) onLate(); }, function(){});
    return Promise.race([p, t]);
  };
  this.onConn = function(cb){ db.ref('.info/connected').on('value', function(s){ cb(s.val() === true); }); };
}

var impl = LOCAL ? new Local() : new Fire(), ready = null;
return {
  LOCAL: LOCAL, FORCED: FORCED, ROOM_RE: ROOM_RE, KEY_RE: KEY_RE, SLOT_RE: SLOT_RE, ANS_RE: ANS_RE, CH: CH, log: log,
  randRoom: function(){ return rand(6); }, randKey: function(){ return rand(10); }, // 秘密＝32文字×10＝50ビット（crypto）
  init: function(){ return ready || (ready = impl.init().then(function(){ return {uid: impl.uid, mode: impl.mode}; })); }, // 何度呼んでも1回だけ
  create: function(g, key, n, slots){ return impl.create(g, key, n, slots); },
  register: function(g, key){ return impl.register(g, key); },
  watch: function(g, cb){ return impl.watch(g, function(d){ cb(rec(d)); }); },
  claim: function(g){ return impl.claim(g).then(rec); },
  getSlot: function(g, e){ return impl.getSlot(g, e).then(rec); },
  remove: function(g){ return impl.remove(g); },
  send: function(g, e, a, onLate){ return impl.send(g, e, a, onLate); },
  onConn: function(cb){ return impl.onConn(cb); }
};
})();
</script>

<script id="panelui">
(function(){
var $ = function(id){ return document.getElementById(id); };
var g = String(new URLSearchParams(location.search).get('g') || '').toUpperCase(), me = {e: null, visits: [], sel: {}, sent: null}; // sel＝{セット: コード}・sent＝送った答えの文字列
window.PHONE_PANEL = me; // 点検用
function msg(t){ $('msg').hidden = !t; $('msg').textContent = t || ''; }
function status(t, cls){ $('status').textContent = t || ''; $('status').className = cls || ''; }
function key(){ return 'phone_panel_' + g + '_' + me.e; }
function save(){ try { localStorage.setItem(key(), JSON.stringify({sel: me.sel, sent: me.sent})); } catch (e) {} }
function load(){ try { return JSON.parse(localStorage.getItem(key()) || 'null'); } catch (e) { return null; } }
function answerStr(){ return me.visits.map(function(v){ return v.set + ':' + me.sel[v.set]; }).join('|'); }
function left(){ return me.visits.filter(function(v){ return !me.sel[v.set]; }).length; }

function render(){
  var h = '';
  me.visits.forEach(function(v){
    h += '<section class="set">' + (me.visits.length > 1 ? '<h2>セット' + v.set + '</h2>' : '') + '<div class="codes">'
      + v.codes.map(function(c){ return '<button type="button" data-set="' + v.set + '" data-code="' + c + '" aria-pressed="' + String(me.sel[v.set] === c) + '">' + c + '</button>'; }).join('') + '</div></section>';
  });
  $('sets').innerHTML = h; bar();
}
function bar(){
  var n = left(), now = answerStr();
  $('send').disabled = n > 0 || me.sent === now; // 送ったあとは、答えを直すまで押せない（「送りました」を見せたまま）
  if (n > 0) status('あと' + n + 'セット選んでください。', '');
  else if (me.sent === now) status('送りました。ありがとうございました。直すときは、選び直してもう一度「送る」を押してください。', 'ok');
  else if (me.sent) status('直した答えは、まだ送っていません。', 'ng');
  else status('全部選びました。「送る」を押してください。', '');
}
$('sets').addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-code]'); if (!b) return;
  me.sel[+b.getAttribute('data-set')] = +b.getAttribute('data-code'); save(); render();
});
$('send').addEventListener('click', function(){
  if (left()) return;
  var a = answerStr(), btn = this; btn.disabled = true; status('送っています…', '');
  STORE.send(g, me.e, a, function(){ me.sent = a; save(); bar(); }).then(function(){ me.sent = a; save(); bar(); }, function(err){
    btn.disabled = false;
    status(err && err.offline ? '送れていません（電波がないようです）。つながる所で、もう一度「送る」を押してください。' : '送れていません。もう一度「送る」を押してください。', 'ng');
  });
});

if (!STORE.ROOM_RE.test(g)){ msg('この画面のアドレスが正しくありません。係の人のQRコードから開き直してください。'); return; }
STORE.init().then(function(){ return STORE.claim(g); }).then(function(e){
  if (e === null){ msg('この組は見つかりません。係の人に知らせてください。'); return; }
  if (!e){ msg('もう満員です。係の人に知らせてください。'); return; }
  me.e = e;
  return STORE.getSlot(g, e).then(function(s){
    if (typeof s !== 'string' || !STORE.SLOT_RE.test(s)){ msg('読み込めませんでした。開き直してください。'); return; }
    var parts = s.split('|'), head = parts.shift(), start = +head.slice(0, -1), dir = head.slice(-1);
    me.visits = parts.map(function(p){ var q = p.split(':'); return {set: +q[0], codes: q[1].split(',').map(Number)}; });
    var old = load(); if (old){ me.sel = old.sel || {}; me.sent = old.sent || null; }
    $('ev').textContent = e;
    if (me.visits.length > 1){ $('route').hidden = false; $('route').textContent = '開始セット：' + start + '・' + (dir === 'L' ? '左へ' : '右へ'); $('rinse').hidden = false; } // 紙の回答用紙と同じ「開始セット：3・左へ」
    msg(''); $('work').hidden = false; $('bar').hidden = false; render();
  });
}).catch(function(){ msg('つながりません。電波を確かめて、開き直してください。'); });
STORE.init().then(function(){ STORE.onConn(function(on){ $('net').hidden = on; }); });
})();
</script>
