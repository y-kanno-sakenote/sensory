<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマホで答える（係）</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#222;--sub:#666;--line:#ddd6ca;--accent:#2f5d8a;--accent-bg:#e8eff6;--warn:#8a4b12;--warn-bg:#fbf0e3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3d43;--accent:#8fb6dd;--accent-bg:#26323f;--warn:#e0b07a;--warn-bg:#3a2e22}}
:root[data-theme="dark"]{--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3d43;--accent:#8fb6dd;--accent-bg:#26323f;--warn:#e0b07a;--warn-bg:#3a2e22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;font-size:16px}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.4em 0 .2em}
.box{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 12px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
input[type=text],input[type=number],select{font-size:1rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=text]{width:10em}
input[type=number]{width:6em}
button{font-size:1rem;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);cursor:pointer}
button.main{background:var(--accent);color:var(--card);font-weight:600}
.msg{font-size:.9rem;color:var(--warn);margin:6px 0}
.mode{font-size:.85rem;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:4px 10px;display:inline-block}
.room{font-size:1.1rem;letter-spacing:.12em}
#qr{background:#fff;padding:12px;display:block;width:fit-content;border-radius:8px;margin:8px auto}
#qr img,#qr canvas{display:block;width:min(80vw,420px);height:auto}
.url{word-break:break-all;font-size:.85rem}
.count{font-size:1.6rem;font-weight:700}
.big{font-size:1.4rem;font-weight:700;margin:.4em 0 .1em}
.sub{color:var(--sub);font-size:.9rem}
.paper{background:#fff;color:#1d1d1d;border:1px solid #d8d2c6;padding:10mm 8mm;margin:10px 0;font-size:12px;line-height:1.6;overflow-x:auto}
.paper h4{font-size:16px;margin:0 0 4px;color:#2b4a6f}
.paper h5{font-size:13px;margin:12px 0 4px;color:#2b4a6f}
.paper table{border-collapse:collapse;font-size:12px}
.paper th,.paper td{border:1px solid #d8d2c6;padding:3px 6px;text-align:left}
.paper th{background:#eef3f8}
[hidden]{display:none!important}
@media print{
  body{background:#fff}
  main>*{display:none!important}
  main>#pour{display:block!important}
  .paper{border:0;padding:0}
}
</style>
</head>
<body>
<main>
<h1>スマホで答える：3点試験法（係用）</h1>
<p id="mode" class="mode" hidden></p>

<section id="setup" class="box">
  <div class="row">試料の名前 <input type="text" id="n0" placeholder="A" aria-label="試料A の名前"> <input type="text" id="n1" placeholder="B" aria-label="試料B の名前"></div>
  <div class="row">1人が回るセットの数（机に並べる数） <select id="desks" aria-label="1人が回るセットの数"></select></div>
  <div class="row">来る人数（多めでよい） <input type="number" id="slots" value="30" min="2" max="200" aria-label="来る人数"></div>
  <p id="setmsg" class="msg"></p>
  <div class="row"><button type="button" id="start" class="main">始める</button></div>
  <details>
    <summary>前の組を開き直す</summary>
    <div class="row">組 <input type="text" id="rgrp" aria-label="組" autocomplete="off"> 呼び出し番号 <input type="text" id="rkey" aria-label="呼び出し番号" autocomplete="off"></div>
    <p class="sub">組は参加用の画面に、呼び出し番号は注ぎ表にあります。この端末で始めた組なら、組だけで開けます。</p>
    <div class="row"><button type="button" id="reopen">開く</button></div>
    <p id="remsg" class="msg"></p>
  </details>
</section>

<section id="run" hidden>
  <div class="box">
    <p class="sub">① 注ぎ表で机を並べる　② QRを見せる　③ 全員が答えたら集計</p>
    <div class="row"><button type="button" id="showpour" aria-pressed="false">注ぎ表を見る</button><button type="button" id="printpour">注ぎ表を印刷</button></div>
    <div id="qr" aria-label="参加用のQRコード"></div>
    <p><span class="count" id="count">答えた人 0人</span><br><span class="sub" id="count2"></span></p>
    <div class="row"><button type="button" id="sum" class="main">集計する</button></div>
    <div id="res" aria-live="polite"></div>
    <p id="runmsg" class="msg"></p>
    <p class="sub">組 <b class="room" id="room"></b>　<span class="url" id="url"></span></p>
  </div>
</section>
<div id="pour" hidden></div>
</main>
